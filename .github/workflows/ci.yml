name: CI

on:
  pull_request:
  push:
    branches: [main, customizable-components]

# Read-only: this also runs on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Same base path the Pages workflow publishes, so a broken subpath fails here.
      # There is no lint script in package.json.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://leon426.github.io
