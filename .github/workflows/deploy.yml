name: Deploy to GitHub Pages

on:
  push:
    branches: [customizable-components]
  workflow_dispatch:

# configure-pages reads the Pages site; deploy-pages writes it.
# Settings → Pages → Source must be "GitHub Actions" or the deploy job fails.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build static site
        # configure-pages reports "/android-canvas" for this project site
        # and "" for a user site or a custom domain at the host root.
        # next.config.ts reads these at build time. Do not pass
        # static_site_generator: next — that action only rewrites
        # next.config.js, and this repo uses next.config.ts.
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # public/.nojekyll is copied into out/. Hidden files are omitted otherwise.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
